; Export presets for gungame (Godot 4.7.1).
;
; Hand-written rather than editor-generated, and deliberately SPARSE: Godot fills
; every option it does not find here with the engine default, so listing only the
; keys we actually want to change keeps this file honest and keeps it from rotting
; the next time the exporter grows a field.
;
; Deviations from stock, and why:
;   binary_format/embed_pck=true      one file per platform instead of exe+pck, so
;                                     the launcher cannot half-install a build.
;   application/modify_resources=false the Windows exporter shells out to `rcedit`
;                                     to stamp the icon and version block into the
;                                     exe. rcedit is a Windows binary and CI builds
;                                     on Linux; leaving this on turns a cosmetic
;                                     step into a build failure. Flip it to true
;                                     locally if you have rcedit configured in
;                                     Editor Settings, and set application/icon to
;                                     a real .ico first.
;
; Everything else — texture formats, D3D12/ANGLE handling, console wrapper — is
; left at the default on purpose. In particular application/export_d3d12 defaults
; to "Auto", which notices that project.godot sets
; rendering/rendering_device/driver.windows="d3d12" and ships the Agility SDK DLLs
; alongside the exe without being told.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/windows/gungame.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
application/modify_resources=false
application/product_name="gungame"
application/file_description="gungame"
application/company_name="kaileh57"

[preset.1]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/linux/gungame.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
